# Bundle patch for @local/dsh-plugin-github.
#
# Inserting the row here is what composes the plugin into a profile. Override
# any value below from the profile's own cordis.patch.yml to change it.
- insert:
    - id: github-connector
      name: '@local/dsh-plugin-github'
      config:
        # Credential reference holding the Personal Access Token. The value
        # itself never lives in configuration: store it in the DSH credentials
        # store, in the Harness home .env, or in the launching environment.
        tokenEnv: GITHUB_TOKEN
        # Change only for GitHub Enterprise Server, for example
        # https://github.example.com/api/v3
        apiBaseUrl: https://api.github.com
        # Per-request timeout in milliseconds.
        timeoutMs: 30000
        # Upper bound on the text one tool call returns to the model.
        maxOutputChars: 60000
        # Extra CA certificates to trust for this process, as a PEM file. Set
        # because this machine routes GitHub through a local TLS-intercepting
        # accelerator (Steam++.Accelerator), whose CA Windows trusts but Node
        # does not. A relative path resolves against the plugin directory.
        # Delete this line if the accelerator is turned off; the path can also
        # be given as NODE_EXTRA_CA_CERTS before DeepSeek Harness starts.
        caFile: ./steampp-ca.pem

# Let HMR watch this plugin's sources so an edit reloads the module instead of
# requiring a process restart. Without a watched root, Node's ESM cache keeps
# serving the module generation loaded at startup, so code changes are invisible
# until DeepSeek Harness restarts. This is machine-specific (it names a local
# directory); drop this entry if the package moves or HMR is unwanted.
- id: hmr
  name: '@deepseek-ai/dsh-hmr'
  config:
    root:
      - '.'
      - 'F:/插件/github-connector'
