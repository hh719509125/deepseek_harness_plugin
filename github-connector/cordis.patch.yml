# Bundle patch for @local/dsh-plugin-github.
#
# Inserting the row here is what composes the plugin into a profile. Override
# any value below from the profile's own cordis.patch.yml to change it.
- insert:
    - id: github-connector
      name: '@local/dsh-plugin-github'
      config:
        # Credential reference holding the Personal Access Token. The value
        # itself never lives in configuration: store it in the DSH credentials
        # store, in the Harness home .env, or in the launching environment.
        tokenEnv: GITHUB_TOKEN
        # Change only for GitHub Enterprise Server, for example
        # https://github.example.com/api/v3
        apiBaseUrl: https://api.github.com
        # Per-request timeout in milliseconds.
        timeoutMs: 30000
        # Upper bound on the text one tool call returns to the model.
        maxOutputChars: 60000

# Machine-specific settings deliberately do not live here. A bundle patch is
# applied to every profile that installs this package, so an absolute path or a
# local certificate would follow other people onto their machines. The TLS
# accelerator's CA file and this package's HMR watch root belong in the
# installing profile's own cordis.patch.yml, which outranks every bundle layer:
#
#   - id: github-connector
#     config:
#       caFile: <absolute path to a PEM bundle>   # only behind a TLS proxy
#   - id: hmr
#     name: '@deepseek-ai/dsh-hmr'
#     config:
#       root: ['.', '<absolute path to this package>']
